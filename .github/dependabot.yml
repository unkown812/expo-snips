version: 2
updates:
  # Workspace dependencies (pnpm-lock.yaml at the repository root).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript-tooling:
        patterns:
          - typescript
          - "@types/*"
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
